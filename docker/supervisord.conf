[supervisord]
nodaemon=true
loglevel=info
user=root

[program:roscore]
command=/bin/bash -c "source /opt/ros/noetic/setup.bash && roscore"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent]
command=/bin/bash -c "source /opt/ros/noetic/setup.bash && python3 -m agent.main --agent-type ros1 --broker-host %(ENV_BROKER_HOST)s --robot-id %(ENV_ROBOT_ID)s"
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=BROKER_HOST="%(ENV_BROKER_HOST)s",ROBOT_ID="%(ENV_ROBOT_ID)s"

[program:simulator]
command=/bin/bash -c "source /opt/ros/noetic/setup.bash && python3 /app/docker/sensor_simulator.py"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
