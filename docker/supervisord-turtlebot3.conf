[supervisord]
nodaemon=true
loglevel=info
user=root

[program:roscore]
command=/bin/bash -c "source /opt/ros/noetic/setup.bash && roscore"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent]
command=/bin/bash -c "source /opt/ros/noetic/setup.bash && python3 -m agent.main --agent-type ros1 --broker-host %(ENV_BROKER_HOST)s --robot-id %(ENV_ROBOT_ID)s"
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=BROKER_HOST="%(ENV_BROKER_HOST)s",ROBOT_ID="%(ENV_ROBOT_ID)s"

[program:turtlebot3]
command=/bin/bash -c "source /opt/ros/noetic/setup.bash && export TURTLEBOT3_MODEL=%(ENV_TURTLEBOT3_MODEL)s && export LIBGL_ALWAYS_SOFTWARE=1 && until rostopic list &>/dev/null; do echo 'waiting for roscore...'; sleep 1; done && roslaunch turtlebot3_gazebo turtlebot3_world.launch"
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=TURTLEBOT3_MODEL="%(ENV_TURTLEBOT3_MODEL)s"

[program:slam]
command=/bin/bash -c "source /opt/ros/noetic/setup.bash && until rostopic list &>/dev/null; do sleep 1; done && roslaunch turtlebot3_slam turtlebot3_slam.launch slam_methods:=gmapping"
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=LIBGL_ALWAYS_SOFTWARE=1
