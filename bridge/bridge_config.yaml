# MQTT-ROS Bridge Configuration
mqtt:
  broker_host: "localhost"
  broker_port: 1883
  client_id: "mqtt_ros_bridge"

ros:
  master_uri: "http://localhost:11311"
  node_name: "mqtt_ros_bridge"
  max_update_frequency: 30.0
  namespace_tf_frames: true  # set true for multi-robot to prefix frame_ids with robot_id/

heartbeat_timeout: 30.0  # seconds before marking robot offline
transmit_config_path: "../config/transmit_config.yaml"

fleet_frames:
  enabled: true
  global_frame: "global_map"
  robots:
    turtlebot_001:
      local_root_frame: "map"
      pose:
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
    turtlebot_002:
      local_root_frame: "map"
      pose:
        x: 2.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
    husky_001:
      local_root_frame: "map"
      pose:
        x: 0.0
        y: 0.0
        z: 0.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
