# Agent 配置文件
# 适用于 Mock Agent 和 ROS Agent

# ============================================================
# 基础设置
# ============================================================

# 机器人 ID（每台机器人唯一）
robot_id: "turtlebot_001"

# MQTT Broker 地址
broker_host: "localhost"
broker_port: 1883

# ============================================================
# 状态上报
# ============================================================

# 状态上报间隔（秒）
status_interval: 2.0

# ============================================================
# 话题控制
# ============================================================

# 默认话题频率上限（Hz），0 表示不限频
default_freq_limit: 30.0

# ============================================================
# HTTP 流服务（重量话题）
# ============================================================

# Agent 在机器人端监听的 HTTP stream 端口。
# 当订阅 PointCloud2 等重型话题并使用 transport: http_stream 时，
# Agent 会通过该端口提供数据，Bridge 再从这个 URL 拉取。
http_stream_port: 8080

# Bridge 可访问的机器人 IP 或主机名。
# 如果为空，Agent 会自动探测本机 IP；真实机器人多网卡、Docker、VPN 场景下建议显式填写。
# stream_public_host: "192.168.1.23"

# 完整覆盖 HTTP stream base URL，优先级高于 stream_public_host + http_stream_port。
# 适合端口映射、反向代理、Docker 容器等场景。
# stream_base_url: "http://192.168.1.23:8080"

# ============================================================
# 连接控制
# ============================================================

# 自动重连
auto_reconnect: true

# 重连延迟（秒）
reconnect_delay: 5.0

# ============================================================
# MQTT Broker 认证（可选）
# ============================================================

# username: ""
# password: ""

# ============================================================
# ROS Agent 特有配置（Mock Agent 忽略）
# ============================================================

# ROS master URI（ROS 1）
# ros_master_uri: "http://localhost:11311"

# ROS 命名空间
# ros_namespace: "/"

# ============================================================
# 订阅与编队通信持久化
# ============================================================

# 地面站下发的持久订阅列表（启动时自动恢复）
subscriptions:
  - topic: "/odom"
    msg_type: "nav_msgs/Odometry"
    freq_limit: 30.0
    transport: "mqtt_json"
  - topic: "/scan"
    msg_type: "sensor_msgs/LaserScan"
    freq_limit: 0.0
    transport: "mqtt_binary"
    qos: 0
    compression: {}
  - topic: "/imu"
    msg_type: "sensor_msgs/Imu"
    freq_limit: 50.0
    transport: "mqtt_json"
  - topic: "/tf"
    msg_type: "tf2_msgs/TFMessage"
    freq_limit: 0.0
    transport: "mqtt_json"
    qos: 0
    compression: {}
  - topic: "/tf_static"
    msg_type: "tf2_msgs/TFMessage"
    freq_limit: 10.0
    transport: "mqtt_json"
  - topic: "/joint_states"
    msg_type: "sensor_msgs/JointState"
    freq_limit: 30.0
    transport: "mqtt_json"
  - topic: "/map"
    msg_type: "nav_msgs/OccupancyGrid"
    freq_limit: 0.2
    transport: "mqtt_binary"
    qos: 0
    compression: {}

# 编队通信规则（地面站下发，启动时自动恢复）
fleet_rules: []
# 格式示例：
# fleet_rules:
#   - topic: "/odom"
#     msg_type: "nav_msgs/Odometry"
#     target: "robot_002"
#     freq_limit: 2.0
#     transport: "mqtt_json"
