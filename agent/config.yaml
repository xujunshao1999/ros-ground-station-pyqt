# Agent 配置文件
# 适用于 Mock Agent 和 ROS Agent

# ============================================================
# 基础设置
# ============================================================

# 机器人 ID（每台机器人唯一）
robot_id: "robot_001"

# MQTT Broker 地址
broker_host: "localhost"
broker_port: 1883

# ============================================================
# 状态上报
# ============================================================

# 状态上报间隔（秒）
status_interval: 2.0

# ============================================================
# 话题控制
# ============================================================

# 默认话题频率上限（Hz），0 表示不限频
default_freq_limit: 10.0

# ============================================================
# HTTP 流服务（重量话题）
# ============================================================

# HTTP 流端口
http_stream_port: 8080

# ============================================================
# 连接控制
# ============================================================

# 自动重连
auto_reconnect: true

# 重连延迟（秒）
reconnect_delay: 5.0

# ============================================================
# MQTT Broker 认证（可选）
# ============================================================

# username: ""
# password: ""

# ============================================================
# ROS Agent 特有配置（Mock Agent 忽略）
# ============================================================

# ROS master URI（ROS 1）
# ros_master_uri: "http://localhost:11311"

# ROS 命名空间
# ros_namespace: "/"

# ============================================================
# 订阅与编队通信持久化
# ============================================================

# 地面站下发的持久订阅列表（启动时自动恢复）
subscriptions: []
# 格式示例：
# subscriptions:
#   - topic: "/odom"
#     msg_type: "nav_msgs/Odometry"
#     freq_limit: 10.0
#     transport: "mqtt_json"
#     compression: {}

# 编队通信规则（地面站下发，启动时自动恢复）
fleet_rules: []
# 格式示例：
# fleet_rules:
#   - topic: "/odom"
#     msg_type: "nav_msgs/Odometry"
#     target: "robot_002"
#     freq_limit: 2.0
#     transport: "mqtt_json"
