# Mosquitto MQTT Broker 配置
# 适用于 ROS 地面站项目
# 跨平台通用配置，Windows/Linux 均可使用

# ============================================================
# 基础设置
# ============================================================

# 监听端口
listener 1883

# 允许匿名连接（开发阶段，生产环境请关闭）
allow_anonymous true

# 协议版本（MQTT v5 兼容 v3.1.1）
# 默认支持所有版本，无需特别指定

# ============================================================
# 持久化
# ============================================================

# 持久化存储路径（相对于 mosquitto 可执行文件目录）
# Windows: 安装目录下 data/ 文件夹
# Linux: /var/lib/mosquitto/
persistence true
persistence_location data/

# 自动保存间隔（秒）
autosave_interval 1800

# ============================================================
# 日志
# ============================================================

# 日志输出到文件
log_dest file logs/mosquitto.log

# 日志类型
log_type error
log_type warning
log_type notice

# 连接/断开日志
connection_messages true

# 时间戳格式
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ============================================================
# 连接控制
# ============================================================

# 最大连接数（-1 表示无限制）
max_connections -1

# 最大队列长度（QoS 1/2 消息）
max_queued_messages 1000

# 保活间隔（秒），客户端超过此时间无响应则断开
# 设为 600 秒（10 分钟），适合弱网环境
max_keepalive 600

# 允许零长度 client_id
allow_zero_length_clientid true

# ============================================================
# 安全（开发阶段暂不启用）
# ============================================================

# 密码文件（启用认证时取消注释）
# password_file pwfile

# ACL 文件（启用访问控制时取消注释）
# acl_file aclfile

# TLS/SSL（启用加密时取消注释）
# listener 8883
# cafile certs/ca.crt
# certfile certs/server.crt
# keyfile certs/server.key
# require_certificate false

# ============================================================
# WebSocket 支持（前端直连用，Phase 2+ 可选）
# ============================================================

# listener 9001
# protocol websockets
